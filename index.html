<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharif Zone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #05080f;
      color: #e8edf4;
      font-family: 'Inter', sans-serif;
    }

    /* ── Canvas ── */
    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Gradient orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
    }
    .o1 {
      width: 700px; height: 700px;
      background: radial-gradient(circle, #ff5500 0%, transparent 70%);
      opacity: 0.15;
      top: -200px; left: -150px;
      animation: drift1 22s ease-in-out infinite;
    }
    .o2 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
      opacity: 0.16;
      bottom: -180px; right: -100px;
      animation: drift2 28s ease-in-out infinite;
    }
    .o3 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #ff8c00 0%, transparent 70%);
      opacity: 0.12;
      top: 40%; left: 55%;
      animation: drift3 18s ease-in-out infinite;
    }
    .o4 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #6d28d9 0%, transparent 70%);
      opacity: 0.10;
      top: 10%; right: 15%;
      animation: drift4 24s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%,100% { transform: translate(0px,  0px)  scale(1.0); }
      30%      { transform: translate(80px, 60px) scale(1.15); }
      60%      { transform: translate(30px,-50px) scale(0.95); }
    }
    @keyframes drift2 {
      0%,100% { transform: translate(0px,   0px)  scale(1.0); }
      40%      { transform: translate(-90px, 50px) scale(1.1); }
      70%      { transform: translate(40px, -70px) scale(0.9); }
    }
    @keyframes drift3 {
      0%,100% { transform: translate(0px,  0px) scale(1.0); }
      50%      { transform: translate(-70px,80px) scale(1.2); }
    }
    @keyframes drift4 {
      0%,100% { transform: translate(0px,  0px) scale(1.0); }
      35%      { transform: translate(50px,-60px) scale(1.1); }
      70%      { transform: translate(-40px,40px) scale(0.85); }
    }

    /* ── Vignette ── */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 40%,
        rgba(5,8,15,0.6) 100%);
      pointer-events: none;
    }

    /* ── Hero content ── */
    .hero {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ff8c42;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(64px, 10vw, 120px);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -3px;
      margin-bottom: 28px;
    }

    h1 .g {
      background: linear-gradient(135deg, #ff6a00 0%, #ff8c42 45%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub {
      font-size: clamp(15px, 1.8vw, 18px);
      font-weight: 300;
      color: rgba(220, 230, 245, 0.9);
      max-width: 440px;
      line-height: 1.7;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="orb o4"></div>
<div class="vignette"></div>

<div class="hero">
  <div class="eyebrow">Ideas &nbsp;·&nbsp; Analysis &nbsp;·&nbsp; Strategy</div>
  <h1><span class="g">Sharif</span><br>Zone</h1>
  <p class="sub">A space for rigorous thinking across macroeconomics,
    geopolitics, technology, and the life sciences.</p>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const N      = 110;
  const LINK   = 160;
  const PUSH   = 130;
  const SPEED  = 1.8;

  let W, H, mx = -999, my = -999;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  document.addEventListener('mouseleave', () => { mx = -999; my = -999; });

  // Particles
  const pts = Array.from({ length: N }, () => ({
    x:  Math.random() * W,
    y:  Math.random() * H,
    vx: (Math.random() - 0.5) * SPEED,
    vy: (Math.random() - 0.5) * SPEED,
    r:  Math.random() * 1.5 + 0.8,
  }));

  // Hue shifts slowly over time — start in orange range
  let hue = 25;

  function frame() {
    ctx.clearRect(0, 0, W, H);
    hue = (hue + 0.04) % 360;

    pts.forEach(p => {
      // Mouse repulsion
      const dx = p.x - mx;
      const dy = p.y - my;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d < PUSH && d > 0) {
        const f = ((PUSH - d) / PUSH) ** 2 * 1.8;
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }

      // Ambient noise nudge
      p.vx += (Math.random() - 0.5) * 0.08;
      p.vy += (Math.random() - 0.5) * 0.08;

      // Dampen
      p.vx *= 0.96;
      p.vy *= 0.96;

      // Speed cap
      const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (spd > SPEED * 2.5) { p.vx *= (SPEED * 2.5) / spd; p.vy *= (SPEED * 2.5) / spd; }

      // Wrap edges
      p.x = (p.x + p.vx + W) % W;
      p.y = (p.y + p.vy + H) % H;

      // Draw dot
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 90%, 72%, 0.7)`;
      ctx.fill();
    });

    // Draw connections
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x;
        const dy = pts[i].y - pts[j].y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < LINK) {
          const a = (1 - d / LINK) * 0.45;
          const h2 = (hue + 40) % 360;
          const grad = ctx.createLinearGradient(pts[i].x, pts[i].y, pts[j].x, pts[j].y);
          grad.addColorStop(0, `hsla(${hue}, 90%, 70%, ${a})`);
          grad.addColorStop(1, `hsla(${h2},  85%, 65%, ${a})`);
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.strokeStyle = grad;
          ctx.lineWidth   = 0.7;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(frame);
  }

  frame();
})();
</script>
</body>
</html>
